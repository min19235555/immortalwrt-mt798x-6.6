name: Build ImmortalWrt for Radxa CM5 Lite

on:
  push:
    branches:
      - cm5-lite
  workflow_dispatch:

concurrency:
  group: cm5-lite-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3 python3-dev \
            python3-setuptools python3-pyelftools swig rsync unzip \
            zlib1g-dev file wget ccache libelf-dev

      - name: Configure firmware
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_radxa_cm5_lite_asm1184e=y
          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024

          # === LuCI 基础 ===
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_luci-app-cpufreq=y
          CONFIG_PACKAGE_luci-app-autoreboot=y
          CONFIG_PACKAGE_luci-app-arpbind=y
          CONFIG_PACKAGE_luci-app-accesscontrol=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-app-filetransfer=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-vnstat2=y
          CONFIG_PACKAGE_luci-app-alist=y
          CONFIG_PACKAGE_luci-app-vsftpd=y

          # === 主题 ===
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          # === 科学上网 ===
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-passwall=y

          # === DNS/广告过滤 ===
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_dnsproxy=y

          # === WireGuard / Zerotier ===
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-app-zerotier=y

          # === frp 内网穿透 ===
          CONFIG_PACKAGE_luci-app-frps=y
          CONFIG_PACKAGE_luci-app-frpc=y

          # === 常用工具 ===
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nmon=y
          CONFIG_PACKAGE_bandwidthd=y
          CONFIG_PACKAGE_coremark=y
          CONFIG_PACKAGE_autoclock=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_kmod-docker-netlink=y
          CONFIG_PACKAGE_kmod-docker-bpf=y
          CONFIG_PACKAGE_pdnsd=y

          # === 核心系统包 ===
          CONFIG_PACKAGE_kmod-rtl8821cu=y
          CONFIG_PACKAGE_kmod-rtl8822bu=y
          CONFIG_PACKAGE_kmod-mt76=y
          CONFIG_PACKAGE_kmod-cfg80211=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_hostapd-openssl=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_odhcpd=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_netifd=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-nat6=y

          # === 额外内核模块 ===
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_kmod-nft-synproxy=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-sched-fq_codel=y

          # === SQM/QoS 流量管理 ===
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-app-nft-qos=y

          # === Passwall 内核 ===
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_hysteria2=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_trojan=y
          CONFIG_PACKAGE_shadowsocks-libev=y
          CONFIG_PACKAGE_v2ray-plugin=y

          # === 依赖库 ===
          CONFIG_PACKAGE_libdns=y
          CONFIG_PACKAGE_libdaemon=y
          CONFIG_PACKAGE_libev=y
          CONFIG_PACKAGE_libpcre=y
          CONFIG_PACKAGE_libevent2=y
          CONFIG_PACKAGE_libcap=y
          CONFIG_PACKAGE_libnl=y
          CONFIG_PACKAGE_libstdcpp=y
          CONFIG_PACKAGE_libuuid=y
          CONFIG_PACKAGE_libelf=y
          CONFIG_PACKAGE_libpcap=y
          CONFIG_PACKAGE_libopenssl=y
          CONFIG_PACKAGE_libcurl=y
          CONFIG_PACKAGE_libjson-c=y
          CONFIG_PACKAGE_libyaml=y
          CONFIG_PACKAGE_boost=y
          CONFIG_PACKAGE_libco=y
          CONFIG_PACKAGE_libsodium=y
          CONFIG_PACKAGE_mlog=y
          CONFIG_PACKAGE_mihomo=y
          CONFIG_PACKAGE_pdnsd-alt=y
          EOF
          make defconfig
          echo '--- selected packages ---'
          grep '=y' .config | grep -E 'CONFIG_PACKAGE_(openclash|passwall|argon|bootstrap|smartdns|wireguard|frps|zerotier|xray|hysteria|sing-box|sqm|docker)' | sort

      - name: Patch QModem (no destructive PCIe rescan)
        run: |
          f=feeds/qmodem/application/modem_scan/src/modem_scand.c
          sed -i 's|open("/sys/bus/pci|open("/tmp/pci|' "$f"
          echo 'QModem patched'

      - name: Build firmware
        run: |
          set -o pipefail
          make -j"$(nproc)" download
          make -j"$(nproc)" V=s world 2>&1 | tee build.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-rockchip-armv8
          path: |
            bin/targets/rockchip/armv8/*.img.gz
            bin/targets/rockchip/armv8/*.sha256
            bin/targets/rockchip/armv8/*.manifest
            bin/targets/rockchip/armv8/*.buildinfo
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
